name: Build WF
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
      # - feature
  workflow_dispatch:
    schedule:
      - cron: "10 14 * * 1-5" # Afternoon 2:10 pm, M-F

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # number of commits to fetch. 0 means fetch all

      - name: Maven Build
        run: mvn install

  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Code checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run tests on main branch
        run: mvn test

      - name: Checkstyle
        run: mvn checkstyle:checkstyle
