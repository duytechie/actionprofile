name: CI/CD Workflow

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  # CI: Build, Test, and Package — runs once, produces a single WAR artifact
  # mvn install = compile + test + package in one Maven lifecycle
  # Checkstyle is added here so tests and style checks share the same run
  CI:
    name: Build, Test & Package
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Build, test and package (mvn install)
        # compile → test → package all in one Maven lifecycle.
        # No need for a separate 'mvn test' step afterward.
        run: mvn install

      - name: Checkstyle
        run: mvn checkstyle:checkstyle

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: vprofile-app
          path: target/*.war
          # Retain artifact for 7 days (default is 90)
          retention-days: 7

  # Security scan runs in parallel with CI — no need to wait for the build
  Security_Scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: json
          # exit-code:
          # 0 : continue if vulnerabilities are found
          # 1 : the workflow will be failed if vulnerabilities are found
          exit-code: 1
          vuln-type: os,library
          output: trivy-results.json
          # trivy-config: trivy.yaml

      - name: Upload Trivy scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.json

  # Docker build jobs: download the pre-built WAR, then do a lightweight
  # Docker build (no Maven inside Docker). Uses the non-multistage Dockerfile
  # which simply COPYs target/*.war into the Tomcat image.
  BUILD_AMD64:
    name: Build AMD64
    runs-on: ubuntu-latest
    environment: ghcr
    needs: [CI, Security_Scan]
    if: github.ref == 'refs/heads/main'
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Download pre-built WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: vprofile-app
          path: target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_ACCESS_KEY }}

      - name: Build and push AMD64 image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # Non-multistage Dockerfile: just COPYs the pre-built WAR.
          # Maven does NOT run again here.
          file: Docker-files/app/Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

  BUILD_ARM64:
    name: Build ARM64
    runs-on: ubuntu-24.04-arm
    environment: ghcr
    needs: [CI, Security_Scan]
    if: github.ref == 'refs/heads/main'
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Code checkout
        uses: actions/checkout@v5

      - name: Download pre-built WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: vprofile-app
          path: target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_ACCESS_KEY }}

      - name: Build and push ARM64 image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # Non-multistage Dockerfile: just COPYs the pre-built WAR.
          # Maven does NOT run again here.
          file: Docker-files/app/Dockerfile
          platforms: linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

  PUBLISH_TO_GHCR:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    environment: ghcr
    needs: [BUILD_AMD64, BUILD_ARM64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_ACCESS_KEY }}

      - name: Create and push multi-arch manifest
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          AMD64_DIGEST: ${{ needs.BUILD_AMD64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.BUILD_ARM64.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag $IMAGE_NAME:${{ github.sha }} \
            --tag $IMAGE_NAME:latest \
            $IMAGE_NAME@$AMD64_DIGEST \
            $IMAGE_NAME@$ARM64_DIGEST
