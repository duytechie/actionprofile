name: CI/CD Workflow
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # number of commits to fetch. 0 means fetch all

      - name: Maven Build
        run: mvn install

      - name: Upload Build Artifact (WAR)
        uses: actions/upload-artifact@v4
        with:
          name: vprofile-app
          path: target/*.war

      - name: Notify if Build Fails
        if: failure()
        run: echo "Build job failed! Please check logs."

  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Code checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run tests on main branch
        run: mvn test

      - name: Checkstyle
        run: mvn checkstyle:checkstyle

  Security_Scan:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: json
          # exit-code:
          # 0 : continue if vulnerabilities are found
          # 1 : the workflow will be failed if vulnerabilities are found
          exit-code: 0
          vuln-type: os,library
          output: trivy-results.json
          # trivy-config: trivy.yaml

      - name: Upload Trivy scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.json

  BUILD_AMD64:
    name: Build AMD64
    runs-on: ubuntu-latest
    environment: ghcr
    needs: [Build, Testing, Security_Scan]
    if: github.ref == 'refs/heads/main'
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_ACCESS_KEY }}

      - name: Build and push AMD64 image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker-files/app/multistage/Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

  BUILD_ARM64:
    name: Build ARM64
    runs-on: ubuntu-latest
    environment: ghcr
    needs: [Build, Testing, Security_Scan]
    if: github.ref == 'refs/heads/main'
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_ACCESS_KEY }}

      - name: Build and push ARM64 image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker-files/app/multistage/Dockerfile
          platforms: linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

  PUBLISH_TO_GHCR:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    environment: ghcr
    needs: [BUILD_AMD64, BUILD_ARM64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_ACCESS_KEY }}

      - name: Create and push multi-arch manifest
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          AMD64_DIGEST: ${{ needs.BUILD_AMD64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.BUILD_ARM64.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag $IMAGE_NAME:${{ github.sha }} \
            --tag $IMAGE_NAME:latest \
            $IMAGE_NAME@$AMD64_DIGEST \
            $IMAGE_NAME@$ARM64_DIGEST
